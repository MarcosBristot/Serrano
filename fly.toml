# Fly.io: API e worker da mesma imagem (Dockerfile), em São Paulo, perto do Supabase sa-east-1.
# Passo a passo e segredos em docs/deploy.md. Nome do app: troque se "serrano-api" estiver ocupado.
app = "serrano-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  AMBIENTE = "prod"
  STORAGE_BACKEND = "supabase"
  DB_MODO_POOLER = "transacao"
  LOG_JSON = "true"
  LOG_LEVEL = "INFO"
  PORT = "8000"

# Pool por processo: o pooler do Supabase (modo transação) aguenta poucos clientes no plano free.
[processes]
  api = "env DB_POOL_MAX=3 sistemacampero api"
  worker = "env DB_POOL_MAX=2 sistemacampero worker"

[http_service]
  processes = ["api"]
  internal_port = 8000
  force_https = true
  # Uma máquina sempre ligada: o produtor não espera a API "acordar".
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

# O worker lê o pendrive inteiro (zip, Parquet) em memória: precisa de mais que a API.
[[vm]]
  processes = ["api"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "1gb"

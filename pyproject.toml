[project]
name = "sistemacampero"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raul Werner", email = "qrananico25@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "grpcio-tools>=1.84.0",
    "pandas>=3.0.6",
    "protobuf>=7.36.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
    "supabase>=2.32.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
sistemacampero = "sistemacampero:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[project]
name = "sistemacampero"
version = "1.0.0a1"
description = "Backend do Sistema Campero: telemetria multimarca de frotas agrícolas"
readme = "README.md"
authors = [
    { name = "Raul Werner", email = "qrananico25@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "shapely>=2.0",
    "python-multipart>=0.0.9",
    "pyproj>=3.6",
    "email-validator>=2.1",
    "xlsxwriter>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=3.0.5.260914",
    "types-shapely>=2.1.0.20260728",
]

[project.scripts]
sistemacampero = "sistemacampero.interfaces.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integracao: precisa de PostgreSQL + PostGIS (CAMPERO_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/sistemacampero/infrastructure/persistence/*" = ["E501"]  # SQL legível > 100 colunas

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["sistemacampero"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["xlsxwriter", "xlsxwriter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sistemacampero.domain.*", "sistemacampero.application.*"]
strict = true

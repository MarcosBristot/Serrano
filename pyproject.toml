[project]
name = "sistemacampero"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raul Werner", email = "qrananico25@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "pandas>=3.0.6",
    "pyarrow>=17.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[project.scripts]
sistemacampero = "sistemacampero:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

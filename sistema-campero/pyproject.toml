[project]
name = "sistema-campero"
version = "0.1.0"
description = "Hub central de telemetria multimarca — MVP backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "geoalchemy2",
    "shapely",
    "geopandas",
    "pandas",
    "psycopg2-binary",
    "alembic",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check . --fix
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest
        name: Pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]